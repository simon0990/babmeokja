  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      padding: 2rem;
      max-width: 600px;
      width: 100%;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      color: #e94560;
    }

    .subtitle {
      font-size: 1rem;
      color: #888;
      margin-bottom: 2.5rem;
    }

    .result-area {
      min-height: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .food-image-wrap {
      width: 220px;
      height: 220px;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 1.2rem;
      background: #2a2a3e;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.9);
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }

    .food-image-wrap.show {
      opacity: 1;
      transform: scale(1);
    }

    .food-image-wrap.rolling {
      opacity: 0.6;
      transform: scale(0.95);
    }

    .food-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.3s ease;
    }

    .food-image-placeholder {
      font-size: 4rem;
      color: #444;
    }

    .category-badge {
      display: inline-block;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 0.8rem;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.3s ease;
    }

    .category-badge.show {
      opacity: 1;
      transform: translateY(0);
    }

    .food-name {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.4;
      opacity: 0;
      transform: scale(0.8);
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      min-height: 3rem;
    }

    .food-name.show {
      opacity: 1;
      transform: scale(1);
    }

    .food-description {
      font-size: 0.9rem;
      color: #999;
      margin-top: 0.8rem;
      opacity: 0;
      transition: opacity 0.4s ease 0.2s;
    }

    .food-description.show {
      opacity: 1;
    }

    .pick-btn {
      background: #e94560;
      color: white;
      border: none;
      padding: 1rem 3rem;
      font-size: 1.3rem;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .pick-btn:hover {
      background: #c73650;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(233, 69, 96, 0.3);
    }

    .pick-btn:active {
      transform: translateY(0);
    }

    .pick-btn.rolling {
      animation: shake 0.1s infinite;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-3px); }
      75% { transform: translateX(3px); }
    }

    .counter {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #555;
    }

    /* Category colors */
    .cat-korean { background: #2d4a3e; color: #7ecba1; }
    .cat-chinese { background: #4a2d2d; color: #e88888; }
    .cat-japanese { background: #2d3a4a; color: #88b8e8; }
    .cat-western { background: #4a3d2d; color: #e8c888; }
    .cat-asian { background: #3d2d4a; color: #c888e8; }
    .cat-snack { background: #4a4a2d; color: #e8e888; }
    .cat-healthy { background: #2d4a42; color: #88e8d0; }

    .rolling-text {
      animation: fadeInOut 0.08s infinite;
    }

    @keyframes fadeInOut {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
  </style>
</head>

    let isRolling = false;

    const PEXELS_API_KEY = 'dbi6m80zoEieOwUhnmrUZfwtMmPh5ER39ZV5cM8qGnFQqqhKun69hzrp';
    const imageCache = {};

    async function fetchFoodImage(query) {
      if (imageCache[query]) return imageCache[query];
      try {
        const res = await fetch(
          `https://api.pexels.com/v1/search?query=${encodeURIComponent(query + ' food')}&per_page=5&orientation=square`,
          { headers: { Authorization: PEXELS_API_KEY } }
        );
        const data = await res.json();
        if (data.photos && data.photos.length > 0) {
          const url = data.photos[Math.floor(Math.random() * data.photos.length)].src.medium;
          imageCache[query] = url;
          return url;
        }
      } catch (e) {}
      return null;
    }

    function pickFood() {
      if (isRolling) return;
      isRolling = true;

      const btn = document.getElementById('pickBtn');
      const foodName = document.getElementById('foodName');
      const foodDesc = document.getElementById('foodDesc');
      const badge = document.getElementById('categoryBadge');
      const imageWrap = document.getElementById('foodImageWrap');

      btn.classList.add('rolling');
      badge.classList.remove('show');
      foodDesc.classList.remove('show');
      imageWrap.classList.remove('show');
      imageWrap.classList.add('rolling');

      // Rolling animation
      let rollCount = 0;
      const totalRolls = 20;
      const rollInterval = setInterval(() => {
        const randomFood = foods[Math.floor(Math.random() * foods.length)];
        foodName.textContent = randomFood.name;
        foodName.classList.add('show');
        foodName.classList.add('rolling-text');
        rollCount++;

        if (rollCount >= totalRolls) {
          clearInterval(rollInterval);

          // Final pick (avoid same as last)
          let finalIndex;
          do {
            finalIndex = Math.floor(Math.random() * foods.length);
          } while (finalIndex === lastPickedIndex && foods.length > 1);

          lastPickedIndex = finalIndex;
          const picked = foods[finalIndex];

          foodName.classList.remove('rolling-text');
          foodName.textContent = picked.name;
          foodName.classList.add('show');

          // Show category badge
          badge.textContent = picked.category;
          badge.className = `category-badge ${picked.categoryClass} show`;

          // Show description
          foodDesc.textContent = picked.desc;
          foodDesc.classList.add('show');

          // Show image
          imageWrap.classList.remove('rolling');
          fetchFoodImage(picked.img).then(url => {
            if (url) {
              const imgEl = new Image();
              imgEl.className = 'food-image';
              imgEl.alt = picked.name;
              imgEl.onload = () => {
                imageWrap.innerHTML = '';
                imageWrap.appendChild(imgEl);
                imageWrap.classList.add('show');
              };
              imgEl.onerror = () => {
                imageWrap.innerHTML = '<span class="food-image-placeholder">&#127860;</span>';
                imageWrap.classList.add('show');
              };
              imgEl.src = url;
            } else {
              imageWrap.innerHTML = '<span class="food-image-placeholder">&#127860;</span>';
              imageWrap.classList.add('show');
            }
          });

          btn.classList.remove('rolling');
          btn.textContent = '다시 고르기!';
          isRolling = false;

          pickCount++;
          document.getElementById('counter').textContent = `총 ${foods.length}개의 메뉴 중 ${pickCount}번째 선택`;
        }
      }, 60);
    }
